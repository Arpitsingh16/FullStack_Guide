<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCA Roadmap Tracker</title>
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="themes.css">
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1 class="title">MCA Roadmap</h1>
      <button class="reset-btn" onclick="resetAll()">Reset all</button>
      <select id="themeSelector" class="theme-selector">
  <option value="green">Green</option>
  <option value="blue">Blue</option>
  <option value="purple">Purple</option>
  <option value="orange">Orange</option>
  <option value="dark">Dark</option>
</select>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-num" id="s-days">0</div><div class="stat-lbl">Days done</div></div>
      <div class="stat"><div class="stat-num" id="s-items">0</div><div class="stat-lbl">Items ticked</div></div>
      <div class="stat"><div class="stat-num" id="s-pct">0%</div><div class="stat-lbl">Complete</div></div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    <div class="prog-label" id="prog-label">0 of 45 days completed</div>
    <div id="days-container"></div>
  </div>

  <script src="index.js"></script>
  <script src="theme.js"></script>
</body>
</html>
